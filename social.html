<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Links — Dorlorial</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{--gold:#C8952A;--gold-light:#E8B84B;--gold-pale:#F5D98A;--gold-dark:#8A6010;--ink:#060402;--text:#d4b483;--text-dim:#7a6040;}
body{background:var(--ink);color:var(--text);font-family:'EB Garamond',serif;min-height:100vh;overflow-x:hidden;}
#embers{position:fixed;inset:0;z-index:0;pointer-events:none;}

/* HEADER */
header{position:relative;z-index:10;text-align:center;padding:70px 20px 40px;border-bottom:1px solid rgba(200,149,42,0.18);background:linear-gradient(180deg,#0e0a04 0%,transparent 100%);}
.back-link{position:absolute;top:22px;left:22px;font-family:'Cinzel',serif;font-size:0.72rem;letter-spacing:0.28em;text-transform:uppercase;color:var(--gold-dark);text-decoration:none;transition:color 0.2s;}
.back-link:hover{color:var(--gold);}
.hdr-sym{width:50px;height:auto;margin:0 auto 14px;filter:drop-shadow(0 0 14px rgba(200,149,42,0.45));animation:sp 4s ease-in-out infinite;display:block;}
@keyframes sp{0%,100%{filter:drop-shadow(0 0 10px rgba(200,149,42,0.3));}50%{filter:drop-shadow(0 0 22px rgba(232,184,75,0.7));}}
.hdr-eye{font-family:'Cinzel',serif;font-size:0.62rem;letter-spacing:0.5em;text-transform:uppercase;color:var(--gold-dark);margin-bottom:8px;}
.hdr-title{font-family:'Cinzel Decorative',serif;font-size:clamp(1.6rem,5vw,3rem);font-weight:700;background:linear-gradient(180deg,var(--gold-pale) 0%,var(--gold) 55%,var(--gold-dark) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px;}
.hdr-sub{font-family:'EB Garamond',serif;font-style:italic;font-size:0.95rem;color:var(--text-dim);}

/* MAIN */
main{position:relative;z-index:10;max-width:900px;margin:0 auto;padding:48px 24px 80px;}

/* CATEGORY LABEL */
.cat-label{font-family:'Cinzel',serif;font-size:0.62rem;letter-spacing:0.5em;text-transform:uppercase;color:var(--gold-dark);display:flex;align-items:center;gap:16px;margin:40px 0 20px;}
.cat-label::before,.cat-label::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(200,149,42,0.25));}
.cat-label::after{background:linear-gradient(90deg,rgba(200,149,42,0.25),transparent);}
.cat-label:first-child{margin-top:0;}

/* LINK CARDS */
.links-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-bottom:8px;}

.link-card{display:flex;align-items:center;gap:16px;background:linear-gradient(145deg,#110b02,#080500);border:1px solid rgba(200,149,42,0.2);padding:18px 20px;text-decoration:none;color:inherit;transition:all 0.3s;position:relative;overflow:hidden;}
.link-card::before{content:'';position:absolute;top:0;left:0;width:24px;height:24px;border-top:1px solid rgba(200,149,42,0.4);border-left:1px solid rgba(200,149,42,0.4);transition:all 0.3s;}
.link-card::after{content:'';position:absolute;bottom:0;right:0;width:24px;height:24px;border-bottom:1px solid rgba(200,149,42,0.4);border-right:1px solid rgba(200,149,42,0.4);transition:all 0.3s;}
.link-card:hover{border-color:rgba(200,149,42,0.55);transform:translateY(-3px);box-shadow:0 8px 32px rgba(200,149,42,0.1);}
.link-card:hover::before,.link-card:hover::after{width:32px;height:32px;border-color:var(--gold);}

.link-icon{font-size:1.8rem;flex-shrink:0;width:44px;text-align:center;}
.link-info{flex:1;min-width:0;}
.link-name{font-family:'Cinzel',serif;font-size:0.7rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold-light);margin-bottom:4px;}
.link-desc{font-family:'EB Garamond',serif;font-style:italic;font-size:0.85rem;color:var(--text-dim);line-height:1.4;}
.link-badge{display:inline-block;font-family:'Cinzel',serif;font-size:0.36rem;letter-spacing:0.15em;text-transform:uppercase;padding:2px 7px;border:1px solid rgba(200,149,42,0.28);color:var(--gold-dark);margin-top:5px;}
.link-arrow{font-family:'Cinzel',serif;font-size:0.55rem;color:var(--gold-dark);flex-shrink:0;transition:all 0.3s;}
.link-card:hover .link-arrow{color:var(--gold);transform:translateX(3px);}

/* TRANSITION */
.transition-overlay{position:fixed;inset:0;z-index:300;background:#060402;pointer-events:none;opacity:0;transition:opacity 0.7s;}
.transition-overlay.active{opacity:1;pointer-events:all;}
</style>
</head>
<body>

<div id="embers"></div>
<div class="transition-overlay" id="transitionOverlay"></div>

<header>
  <a href="hub.html" class="back-link">← Back</a>
  <img src="Dorlorial_Symbol.png" class="hdr-sym" alt="Dorlorial Symbol">
  <div class="hdr-eye">Tales of Dorlorial</div>
  <h1 class="hdr-title">Links</h1>
  <p class="hdr-sub">Books, socials, and everything Dorlorial.</p>
</header>

<main>

  <!-- BOOKS -->
  <div class="cat-label">Books</div>
  <div class="links-grid">

    <!-- PAPERBACK -->
    <a href="https://www.amazon.com/Tales-Dorlorial-Angel-Hunter-Radney/dp/B0H4YS5KY6/" target="_blank" rel="noopener" class="link-card" style="align-items:flex-start;gap:20px;padding:20px;">
      <div style="flex-shrink:0;width:80px;">
        <img src="Untitled_design.png" alt="The Last Angel Paperback" style="width:100%;display:block;filter:drop-shadow(0 4px 12px rgba(200,149,42,0.3));" onerror="this.style.display='none'">
      </div>
      <div class="link-info" style="flex:1;padding-top:4px;">
        <div class="link-name">The Last Angel</div>
        <div class="link-desc">Tales of Dorlorial · Book One</div>
        <div class="link-badge">Paperback · $9.99</div>
      </div>
      <div class="link-arrow" style="padding-top:4px;">→</div>
    </a>

    <!-- HARDCOVER -->
    <a href="https://www.amazon.com/Tales-Dorlorial-Angel-Hunter-Radney/dp/B0H4YS5KY6/" target="_blank" rel="noopener" class="link-card" style="align-items:flex-start;gap:20px;padding:20px;">
      <div style="flex-shrink:0;width:80px;">
        <img src="Copy_of_Copy_of_Tales_of_Dorlorial_-_1_-_Edited.png" alt="The Last Angel Hardcover" style="width:100%;display:block;filter:drop-shadow(0 4px 12px rgba(200,149,42,0.3));" onerror="this.style.display='none'">
      </div>
      <div class="link-info" style="flex:1;padding-top:4px;">
        <div class="link-name">The Last Angel</div>
        <div class="link-desc">Tales of Dorlorial · Book One</div>
        <div class="link-badge">Hardcover · $18.99</div>
      </div>
      <div class="link-arrow" style="padding-top:4px;">→</div>
    </a>

  </div>

  <!-- SOCIALS -->
  <div class="cat-label">Socials</div>
  <div class="links-grid">

    <a href="https://www.instagram.com/talesofdorlorial/" target="_blank" rel="noopener" class="link-card">
      <div class="link-icon">📸</div>
      <div class="link-info">
        <div class="link-name">Instagram</div>
        <div class="link-desc">@talesofdorlorial</div>
      </div>
      <div class="link-arrow">→</div>
    </a>

    <a href="https://www.tiktok.com/@talesofdorlorial" target="_blank" rel="noopener" class="link-card">
      <div class="link-icon">🎬</div>
      <div class="link-info">
        <div class="link-name">TikTok</div>
        <div class="link-desc">@talesofdorlorial</div>
      </div>
      <div class="link-arrow">→</div>
    </a>

  </div>

</main>

<script>
// Embers
const canvas = document.getElementById('embers');
const ctx = canvas.getContext('2d');
let W, H, particles = [];
function resize(){W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight;}
resize();
window.addEventListener('resize', resize);
function Particle(){
  this.x = Math.random()*W;
  this.y = H + 10;
  this.vx = (Math.random()-0.5)*0.4;
  this.vy = -(Math.random()*0.6+0.3);
  this.life = Math.random()*120+80;
  this.maxLife = this.life;
  this.size = Math.random()*1.8+0.5;
}
for(let i=0;i<60;i++){let p=new Particle();p.y=Math.random()*H;p.life=Math.random()*p.maxLife;particles.push(p);}
function animate(){
  ctx.clearRect(0,0,W,H);
  if(Math.random()<0.3) particles.push(new Particle());
  particles = particles.filter(p=>p.life>0);
  particles.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.life--;
    const a = (p.life/p.maxLife)*0.55;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fillStyle=`rgba(200,149,42,${a})`;
    ctx.fill();
  });
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
