<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>The Shattered Seal — Dorlorial</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{--gold:#C8952A;--gold-light:#E8B84B;--gold-pale:#F5D98A;--gold-dark:#8A6010;--ink:#060402;--text:#d4b483;--text-dim:#7a6040;--green:#4be87a;--red:#e84b4b;--blue:#6bb7ff;}
body{background:radial-gradient(circle at top,#141007 0%,#060402 55%,#020100 100%);color:var(--text);font-family:'EB Garamond',serif;min-height:100vh;overflow-x:hidden;}
#embers{position:fixed;inset:0;z-index:0;pointer-events:none;}
header{position:relative;z-index:10;text-align:center;padding:50px 20px 32px;border-bottom:1px solid rgba(200,149,42,0.2);background:linear-gradient(180deg,#0e0a04 0%,transparent 100%);}
.back-link{position:absolute;top:22px;left:22px;font-family:'Cinzel',serif;font-size:0.72rem;letter-spacing:0.28em;text-transform:uppercase;color:var(--gold-dark);text-decoration:none;}
.back-link:hover{color:var(--gold);}
.header-symbol{font-size:2.6rem;margin-bottom:10px;filter:drop-shadow(0 0 14px rgba(200,149,42,0.45));animation:sp 4s ease-in-out infinite;}
@keyframes sp{0%,100%{filter:drop-shadow(0 0 10px rgba(200,149,42,0.3));}50%{filter:drop-shadow(0 0 22px rgba(232,184,75,0.7));}}
.header-eyebrow{font-family:'Cinzel',serif;font-size:0.62rem;letter-spacing:0.5em;text-transform:uppercase;color:var(--gold-dark);margin-bottom:7px;}
.header-title{font-family:'Cinzel Decorative',serif;font-size:clamp(1.4rem,4.5vw,2.8rem);font-weight:700;background:linear-gradient(180deg,var(--gold-pale) 0%,var(--gold) 55%,var(--gold-dark) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px;}
.header-sub{font-family:'EB Garamond',serif;font-style:italic;font-size:0.95rem;color:var(--text-dim);}
main{position:relative;z-index:10;max-width:920px;margin:0 auto;padding:40px 24px 90px;}
.game{background:linear-gradient(145deg,#0e0a04,#0a0702);border:1px solid rgba(200,149,42,0.25);position:relative;overflow:hidden;box-shadow:0 25px 70px rgba(0,0,0,0.45);}
.game::before{content:'';position:absolute;top:0;left:0;width:38px;height:38px;border-top:1px solid var(--gold);border-left:1px solid var(--gold);}
.game::after{content:'';position:absolute;bottom:0;right:0;width:38px;height:38px;border-bottom:1px solid var(--gold);border-right:1px solid var(--gold);}
.stats{display:grid;grid-template-columns:repeat(6,1fr);border-bottom:1px solid rgba(200,149,42,0.12);}
.stat{padding:10px 12px;text-align:center;border-right:1px solid rgba(200,149,42,0.08);}
.stat:last-child{border-right:none;}
.stat-label{font-family:'Cinzel',serif;font-size:0.38rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold-dark);margin-bottom:3px;}
.stat-val{font-family:'Cinzel Decorative',serif;font-size:1rem;background:linear-gradient(180deg,var(--gold-pale),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hp-bar-wrap{height:3px;background:rgba(232,75,75,0.15);margin-top:4px;}
.hp-bar{height:100%;background:var(--green);transition:width 0.4s;}
.scene{padding:28px 30px 18px;}
.scene-loc{font-family:'Cinzel',serif;font-size:0.5rem;letter-spacing:0.32em;text-transform:uppercase;color:var(--gold-dark);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.scene-loc::after{content:'';flex:1;height:1px;background:rgba(200,149,42,0.12);}
.scene-body{font-family:'EB Garamond',serif;font-size:1.04rem;line-height:1.85;color:var(--text);min-height:90px;}
.scene-body .hl{color:var(--gold-light);}
.scene-body .danger{color:var(--red);font-style:italic;}
.scene-body .good{color:var(--green);}
.scene-body .blue{color:var(--blue);}
.choices{padding:4px 30px 28px;display:flex;flex-direction:column;gap:8px;}
.choice{background:rgba(200,149,42,0.03);border:1px solid rgba(200,149,42,0.15);padding:12px 14px;cursor:pointer;transition:all 0.22s;display:flex;gap:12px;text-align:left;width:100%;}
.choice:hover{background:rgba(200,149,42,0.08);border-color:rgba(200,149,42,0.42);transform:translateX(3px);}
.choice-key{font-family:'Cinzel',serif;font-size:0.48rem;letter-spacing:0.15em;color:var(--gold-dark);flex-shrink:0;margin-top:2px;}
.choice-text{font-family:'EB Garamond',serif;font-size:0.96rem;color:var(--text);line-height:1.5;}
.choice.locked{opacity:.45;cursor:not-allowed;} /* kept for safety, but unavailable choices are now hidden */
.potion-btn{font-family:'Cinzel',serif;font-size:.46rem;letter-spacing:.18em;text-transform:uppercase;color:var(--green);background:rgba(75,232,122,.05);border:1px solid rgba(75,232,122,.25);padding:6px 8px;margin-top:4px;cursor:pointer;}
.potion-btn:hover{background:rgba(75,232,122,.12);border-color:var(--green);}
.setup{padding:30px;}
.setup-title{font-family:'Cinzel Decorative',serif;font-size:1.35rem;color:var(--gold-light);margin-bottom:10px;text-align:center;}
.setup-sub{text-align:center;color:var(--text-dim);font-style:italic;margin-bottom:24px;line-height:1.6;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;}
.card{border:1px solid rgba(200,149,42,.18);background:rgba(200,149,42,.035);padding:16px;cursor:pointer;transition:.22s;min-height:150px;}
.card:hover,.card.selected{border-color:var(--gold);background:rgba(200,149,42,.1);transform:translateY(-2px);}
.card-icon{font-size:1.8rem;margin-bottom:8px;}
.card-name{font-family:'Cinzel',serif;text-transform:uppercase;letter-spacing:.16em;color:var(--gold-light);font-size:.72rem;margin-bottom:7px;}
.card-desc{color:var(--text-dim);line-height:1.45;font-size:.9rem;}
.card-bonus{margin-top:8px;color:var(--green);font-size:.83rem;font-style:italic;}
.setup-actions{text-align:center;margin-top:10px;}
.btn{font-family:'Cinzel',serif;font-size:0.58rem;letter-spacing:0.3em;text-transform:uppercase;color:var(--gold);background:transparent;border:1px solid rgba(200,149,42,0.4);padding:11px 24px;cursor:pointer;transition:all 0.25s;margin:4px;}
.btn:hover:not(:disabled){background:rgba(200,149,42,0.1);border-color:var(--gold);}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.ending{padding:34px 30px;text-align:center;}
.ending-icon{font-size:3rem;margin-bottom:14px;display:block;}
.ending-title{font-family:'Cinzel Decorative',serif;font-size:clamp(1rem,3vw,1.7rem);background:linear-gradient(180deg,var(--gold-pale),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:10px;}
.ending-desc{font-family:'EB Garamond',serif;font-style:italic;font-size:1rem;color:var(--text-dim);line-height:1.7;margin-bottom:18px;}
.ending-score{font-family:'Cinzel',serif;font-size:0.52rem;letter-spacing:0.25em;text-transform:uppercase;color:var(--gold-dark);margin-bottom:20px;line-height:1.7;}
.transition-overlay{position:fixed;inset:0;z-index:300;background:#060402;pointer-events:none;opacity:0;transition:opacity 0.7s;}
.transition-overlay.active{opacity:1;pointer-events:all;}
@keyframes bannerPulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.15);opacity:.7;}}
@keyframes kffix2{0%{transform:scale(1.3);opacity:.6;}100%{transform:scale(1);opacity:1;}}
@media(max-width:760px){.grid{grid-template-columns:1fr;}.stats{grid-template-columns:repeat(2,1fr);}.stat:last-child{grid-column:span 2;}main{padding:24px 14px 70px;}header{padding:44px 14px 28px;}.back-link{position:static;display:inline-block;margin-bottom:18px;}}
</style>
</head>
<body>
<canvas id="embers"></canvas>
<header>
  <a href="hub.html" class="back-link" id="backBtn">← Hub</a>
  <div class="header-symbol">✦</div>
  <p class="header-eyebrow">An Interactive Adventure</p>
  <h1 class="header-title">The Shattered Seal</h1>
  <p class="header-sub">A treasure hunter’s descent beneath Ionsgate, under the roots of Lumina’s Tree of Creativity.</p>
</header>

<main>
  <div class="game" id="game"></div>
</main>

<div class="transition-overlay" id="overlay"></div>

<script>
const RACES = {
  human:{name:'Human',icon:'🕯️',hp:2,item:'Traveler’s Rations',desc:'Balanced, stubborn, and hard to break.',bonus:'+2 Max HP · starts with Traveler’s Rations'},
  kitsune:{name:'Kitsune',icon:'🦊',hp:0,item:'Fox Charm',desc:'Clever spirit-blooded folk with a talent for misdirection.',bonus:'Fox Charm unlocks trickery choices'},
  rakin:{name:'Rakin',icon:'🌿',hp:1,item:'Druidic Token',desc:'Forest-touched wanderers tied to old nature magic.',bonus:'+1 Max HP · nature choices unlock'},
  changeling:{name:'Changeling',icon:'🎭',hp:0,item:'Blank Mask',desc:'Shapeshifters whose identity is a weapon and a question.',bonus:'Blank Mask unlocks disguise choices'},
  ashkari:{name:'Ashkari',icon:'🔥',hp:1,item:'Warm Ember',desc:'Children of ash and survival, difficult to burn away.',bonus:'+1 Max HP · fire resistance story choices'},
  dwarf:{name:'Dwarf',icon:'⛏️',hp:3,item:'Stone Hammer',desc:'Hardy mountain folk with an eye for stonework and traps.',bonus:'+3 Max HP · detects stone traps'}
};

const CLASSES = {
  fighter:{name:'Fighter',icon:'⚔️',hp:3,item:'Iron Blade',desc:'Direct, durable, and deadly when cornered.',bonus:'+3 Max HP · strong combat choices'},
  druid:{name:'Druid',icon:'🌱',hp:1,item:'Healing Herbs',desc:'A keeper of old roots, wild signs, and living magic.',bonus:'+1 Max HP · Healing Herbs restore HP'},
  rogue:{name:'Rogue',icon:'🗡️',hp:0,item:'Lockpicks',desc:'Quick hands, quiet feet, and exits where none should exist.',bonus:'Lockpicks unlock locked paths'},
  wizard:{name:'Wizard',icon:'📘',hp:-1,item:'Spellbook Page',desc:'Fragile, brilliant, and dangerous with enough time to think.',bonus:'Spellbook Page unlocks arcane options'},
  cleric:{name:'Cleric',icon:'☀️',hp:2,item:'Sun Sigil',desc:'A bearer of prayer, resolve, and radiant defiance.',bonus:'+2 Max HP · Sun Sigil harms undead'},
  artificer:{name:'Artificer',icon:'⚙️',hp:1,item:'Aether Tool',desc:'A maker, breaker, and fixer of impossible machines.',bonus:'+1 Max HP · Aether Tool repairs devices'}
};

const SCENES = {
  intro:{
    loc:'Ionsgate — Outer Root Markets',
    text:`You are a treasure hunter with more nerve than coin, hired to find proof of an ancient sealed chamber beneath <span class="hl">Ionsgate</span>, the largest city in the world.

Above you, the continent-city coils around <span class="blue">Lumina’s Tree of Creativity</span>. Below you, its blue-glowing roots twist through forgotten streets, buried workshops, sealed libraries, and places the city pretends were never built.

Your employer gave one warning: <span class="danger">Do not let Captain Malrec reach the seal first.</span>

You descend through a cracked service stair beneath a market of inventors, relic dealers, and thieves.`,
    c:[
      {t:'Buy supplies from a nervous relic vendor.',n:'vendor',sc:1},
      {t:'Question locals about Captain Malrec.',n:'malrec_rumor',sc:1},
      {t:'Slip directly into the root tunnels before anyone sees you.',n:'root_tunnels',sc:2}
    ]
  },

  vendor:{
    loc:'Ionsgate — Relic Vendor Stall',
    text:`The vendor is a tiny old woman with brass goggles and ink stains on both hands. She recognizes the map in your palm and immediately lowers her voice.

"People who follow that map come back wrong," she says. "But wrong people still pay."

She offers three useful items.`,
    c:[
      {t:'Take two health potions.',n:'root_tunnels',potion:2,sc:2},
      {t:'Take a root-lantern that glows near old magic.',n:'root_tunnels',gives:'Root Lantern',sc:3},
      {t:'Take an old vault map covered in corrections.',n:'root_tunnels',gives:'Vault Map',sc:3}
    ]
  },

  malrec_rumor:{
    loc:'Ionsgate — Under-Market Tavern',
    text:`A dice player tells you Captain Malrec used to work with the <span class="hl">Masterwork Coalition</span> before he started selling discoveries to the Spicerunners.

"He's not a fool," the player says. "That's what makes him dangerous. He doesn't break locks. He makes other people open them."

As you leave, someone slips a note into your hand: <span class="danger">He is already below.</span>`,
    c:[
      {t:'Rush after him.',n:'root_tunnels',sc:2},
      {t:'Ask who gave you the note.',n:'note_friend',sc:2},
      {t:'Pay the dice player for one more rumor.',n:'extra_rumor',sc:1}
    ]
  },

  extra_rumor:{
    loc:'Ionsgate — Under-Market Tavern',
    text:`The dice player pockets your coin. "Fine. Malrec has a partner down there. Hooded. Silver mask. Doesn't talk. People call them the Muse."

That name makes the tavern lights flicker.`,
    c:[{t:'Head below with the warning in mind.',n:'root_tunnels',flag:'knows_muse',sc:3}]
  },

  note_friend:{
    loc:'Ionsgate — Back Alley',
    text:`You catch a glimpse of the note-giver: a young scholar with a satchel full of scrolls and a cracked pair of spectacles.

"My name is <span class="hl">Edrin Vale</span>," he whispers. "I was hired to translate the seal. Malrec left me behind when I asked too many questions. Let me come with you and I can read what you cannot."

He looks terrified, but useful.`,
    c:[
      {t:'Let Edrin join you.',n:'root_tunnels',ally:'Edrin',flag:'edrin_friend',sc:4},
      {t:'Tell him to stay away. This is too dangerous.',n:'root_tunnels',flag:'edrin_rejected',sc:1},
      {t:'Threaten him for everything he knows.',n:'edrin_enemy',sc:2}
    ]
  },

  edrin_enemy:{
    loc:'Ionsgate — Back Alley',
    text:`Edrin goes pale, then cold. He gives you the translation key, but the fear in his eyes hardens into something sharper.

"You treasure hunters are all the same," he says.

You gain the key, but not a friend.`,
    c:[{t:'Head below alone.',n:'root_tunnels',gives:'Translation Key',flag:'edrin_enemy',sc:2}]
  },

  root_tunnels:{
    loc:'Beneath Ionsgate — Blue Root Tunnels',
    text:`The city noise fades above you. Down here, the roots of Lumina’s Tree glow faint blue through the stone like veins beneath skin.

Old street signs point to districts that no longer exist. Ahead, the tunnel splits:
Left: a buried artisan quarter.
Right: a maintenance bridge over a dark drop.
Forward: fresh bootprints and torch smoke — Malrec’s trail.`,
    c:[
      {t:'Explore the buried artisan quarter.',n:'artisan_quarter',sc:2},
      {t:'Cross the maintenance bridge.',n:'bridge',sc:2},
      {t:'Follow Malrec’s trail quickly.',n:'malrec_first',sc:2},
      {t:'Use the Vault Map to find a safer route.',n:'map_route',need:'Vault Map',sc:4},
      {t:'Use the Root Lantern to follow old magic.',n:'lantern_route',need:'Root Lantern',sc:4}
    ]
  },

  artisan_quarter:{
    loc:'Buried Artisan Quarter',
    text:`You enter a forgotten neighborhood of shuttered studios and collapsed galleries. Paintings rot on the walls. Sculptures stare from dust.

A small construct shaped like a brass moth lies twitching beneath a fallen shelf.`,
    c:[
      {t:'Repair the brass moth.',n:'moth_friend',need:'Aether Tool',sc:4},
      {t:'Free it carefully without tools.',n:'moth_free',sc:2},
      {t:'Search the studios for supplies.',n:'studio_loot',sc:2},
      {t:'Leave it and continue.',n:'gallery_hall',sc:1}
    ]
  },

  moth_friend:{
    loc:'Buried Artisan Quarter',
    text:`With a few careful turns of your tool, the brass moth sparks alive. It circles your head and projects a tiny golden arrow toward hidden mechanisms.

You have made a small friend.`,
    c:[{t:'Let the moth guide you onward.',n:'gallery_hall',ally:'Brass Moth',gives:'Brass Moth',flag:'moth_friend',sc:5}]
  },

  moth_free:{
    loc:'Buried Artisan Quarter',
    text:`You lift the shelf just enough for the brass moth to escape. It flutters around you once, then disappears into a crack.

A moment later, it drops a tiny potion vial at your feet before vanishing.`,
    c:[{t:'Pocket the potion and move on.',n:'gallery_hall',potion:1,sc:3}]
  },

  studio_loot:{
    loc:'Buried Studios',
    text:`You find a dusty pack left by a previous explorer. Inside: one health potion, a silver chalk stick, and a sketch of the seal beneath the tree roots.`,
    c:[
      {t:'Take the potion and chalk.',n:'gallery_hall',potion:1,gives:'Silver Chalk',sc:3},
      {t:'Study the seal sketch first.',n:'seal_sketch',sc:3}
    ]
  },

  seal_sketch:{
    loc:'Buried Studios',
    text:`The sketch shows the seal is not just a lock. It is a story written in stone. It needs three things to close properly: <span class="hl">a name, a memory, and a creative spark.</span>`,
    c:[{t:'Remember this and continue.',n:'gallery_hall',flag:'knows_three_keys',sc:4}]
  },

  gallery_hall:{
    loc:'Hall of Unfinished Art',
    text:`The hall is lined with unfinished paintings. Each one shows you doing something you have not done yet.

In one, you shake hands with Malrec.
In another, Edrin bleeds on the floor.
In a third, you wear a crown of roots and cannot stop smiling.`,
    c:[
      {t:'Slash the painting of Edrin bleeding.',n:'painting_warning',sc:2},
      {t:'Study the painting of Malrec.',n:'malrec_painting',sc:2},
      {t:'Keep walking. Do not let art choose your future.',n:'bridge',sc:2}
    ]
  },

  painting_warning:{
    loc:'Hall of Unfinished Art',
    text:`The canvas tears open. Behind it is a hidden cache: a health potion and a note in Malrec’s handwriting.

"Fear makes people predictable. Offer rescue, then demand obedience."`,
    c:[{t:'Take the potion and continue.',n:'bridge',potion:1,flag:'knows_malrec_method',sc:4}]
  },

  malrec_painting:{
    loc:'Hall of Unfinished Art',
    text:`In the painting, Malrec looks tired. Not evil. Not cruel. Desperate.

Behind him stands a silver-masked figure with one hand on his shoulder.`,
    c:[{t:'Continue with a new doubt in your mind.',n:'bridge',flag:'malrec_controlled',sc:4}]
  },

  bridge:{
    loc:'Root Bridge Over the Old City',
    text:`A bridge of tangled roots stretches over a buried city block. Far below, old lamps flicker in streets sealed under Ionsgate generations ago.

Halfway across, the bridge shifts. Not breaking — reacting.`,
    c:[
      {t:'Cross slowly and keep your balance.',n:'bridge_success',sc:2},
      {t:'Sprint before it moves again.',n:'bridge_sprint',hp:-1,sc:2},
      {t:'Use the Druidic Token to calm the roots.',n:'bridge_roots',need:'Druidic Token',sc:5},
      {t:'Use the Brass Moth to find stable root knots.',n:'bridge_moth',need:'Brass Moth',sc:5}
    ]
  },

  bridge_success:{
    loc:'Root Bridge',
    text:`You cross safely, though the roots flex under your boots like muscles. On the far side, you find a cracked fountain filled with clear water.`,
    c:[
      {t:'Drink and recover.',n:'malrec_first',hp:2,sc:2},
      {t:'Bottle some water as a potion substitute.',n:'malrec_first',potion:1,sc:3}
    ]
  },

  bridge_sprint:{
    loc:'Root Bridge',
    text:`You make it across, but a root snaps upward and catches your ribs. Pain blooms, but nothing is broken.`,
    c:[{t:'Keep moving.',n:'malrec_first',sc:1}]
  },

  bridge_roots:{
    loc:'Root Bridge',
    text:`You press the token to the bridge. The roots settle beneath your hands, almost purring. A blue flower blooms from the wood and folds itself into a healing draught.`,
    c:[{t:'Take the root-bloom potion.',n:'malrec_first',potion:1,flag:'tree_respect',sc:5}]
  },

  bridge_moth:{
    loc:'Root Bridge',
    text:`The brass moth projects golden points across the safest path. You cross easily and spot something hidden beneath the bridge: Malrec’s dropped signet.`,
    c:[{t:'Take the signet.',n:'malrec_first',gives:'Malrec Signet',sc:5}]
  },

  map_route:{
    loc:'Old Surveyor’s Route',
    text:`The Vault Map shows a route through forgotten drainage tunnels. It smells awful, but the path avoids several collapsed chambers.

You also find an emergency cache marked by old Ionsgate surveyors.`,
    c:[
      {t:'Take the cache supplies.',n:'archive_door',potion:2,sc:5},
      {t:'Move quickly and ignore the cache.',n:'archive_door',sc:3}
    ]
  },

  lantern_route:{
    loc:'Lumina’s Root Path',
    text:`The Root Lantern glows brighter near living magic. It leads you through a narrow passage where roots have grown into the shape of open books.

A whisper says: "Create, do not consume."`,
    c:[
      {t:'Answer by sketching a new symbol with Silver Chalk.',n:'creative_spark',need:'Silver Chalk',sc:6},
      {t:'Offer a memory of why you became a treasure hunter.',n:'memory_offer',sc:4},
      {t:'Keep the lantern high and continue.',n:'archive_door',sc:3}
    ]
  },

  creative_spark:{
    loc:'Lumina’s Root Path',
    text:`You draw a symbol that did not exist before this moment: a key made from a question mark.

The roots glow warmly. You feel the seal far below recognize your imagination.`,
    c:[{t:'Carry the creative spark onward.',n:'archive_door',gives:'Creative Spark',flag:'creative_spark',sc:7}]
  },

  memory_offer:{
    loc:'Lumina’s Root Path',
    text:`You speak the truth: treasure hunting was never just about money. It was about proving forgotten things still mattered.

The roots accept the memory without taking it from you.`,
    c:[{t:'Continue lighter than before.',n:'archive_door',flag:'honest_memory',sc:5}]
  },

  malrec_first:{
    loc:'First Sign of Malrec',
    text:`You find three of Malrec’s hired blades unconscious beside a cracked wall. No blood. No wounds. Just blank faces and empty eyes.

A message is carved into the wall: <span class="danger">THE MUSE COLLECTS WHAT MEN WASTE.</span>

Bootprints continue toward the Archive Door.`,
    c:[
      {t:'Check the unconscious mercenaries.',n:'mercs',sc:2},
      {t:'Follow the bootprints.',n:'archive_door',sc:2},
      {t:'Use the Sun Sigil to ward the area.',n:'sun_ward',need:'Sun Sigil',sc:5}
    ]
  },

  mercs:{
    loc:'Collapsed Service Hall',
    text:`One mercenary wakes for half a second and grabs your wrist.

"Malrec isn't alone," she whispers. "The silver mask makes him hear his dead daughter."

Then she passes out again.`,
    c:[{t:'Leave her a potion and continue.',n:'archive_door',potion:-1,flag:'showed_mercy',sc:5},{t:'Save your supplies and continue.',n:'archive_door',sc:1}]
  },

  sun_ward:{
    loc:'Collapsed Service Hall',
    text:`The Sun Sigil flashes. Something invisible shrieks and flees through the roots. The mercenaries breathe easier.`,
    c:[{t:'Continue while the path is safe.',n:'archive_door',flag:'sun_warded',sc:5}]
  },

  archive_door:{
    loc:'The Archive Door',
    text:`A round door blocks your path. It is covered in rotating rings of old Ionsgate script.

Before you can touch it, Captain Malrec steps from the shadows.

He is older than you expected, with tired eyes and a sword that has seen too much use. "Turn around," he says. "Whatever you were promised, it is not worth meeting the Muse."`,
    c:[
      {t:'Attack Malrec before he can stop you.',n:'malrec_duel',hp:-2,sc:2},

let gs = {hp:12,maxHp:12,items:[],flags:{},score:0,moves:0,race:null,cls:null,potions:0,ally:null};
let cid = 'intro';
let selectedRace = null;
let selectedClass = null;

function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

function hasItem(item){return gs.items.includes(item);}
function hasFlag(flag){return !!gs.flags[flag];}

function renderSetup(){
  const game = document.getElementById('game');
  const raceCards = Object.entries(RACES).map(([id,r])=>`
    <div class="card ${selectedRace===id?'selected':''}" onclick="selectRace('${id}')">
      <div class="card-icon">${r.icon}</div>
      <div class="card-name">${r.name}</div>
      <div class="card-desc">${r.desc}</div>
      <div class="card-bonus">${r.bonus}</div>
    </div>`).join('');

  const classCards = Object.entries(CLASSES).map(([id,c])=>`
    <div class="card ${selectedClass===id?'selected':''}" onclick="selectClass('${id}')">
      <div class="card-icon">${c.icon}</div>
      <div class="card-name">${c.name}</div>
      <div class="card-desc">${c.desc}</div>
      <div class="card-bonus">${c.bonus}</div>
    </div>`).join('');

  game.innerHTML = `
    <div class="setup">
      <div class="setup-title">Create Your Adventurer</div>
      <div class="setup-sub">Choose a race and class. Your choices change your health, inventory, and which story paths you can unlock.</div>
      <div class="scene-loc">Choose Race</div>
      <div class="grid">${raceCards}</div>
      <div class="scene-loc">Choose Class</div>
      <div class="grid">${classCards}</div>
      <div class="setup-actions">
        <button class="btn" onclick="startGame()" ${(!selectedRace||!selectedClass)?'disabled':''}>Begin</button>
      </div>
    </div>`;
}

function selectRace(id){selectedRace=id;renderSetup();}
function selectClass(id){selectedClass=id;renderSetup();}

function startGame(){
  const r = RACES[selectedRace], c = CLASSES[selectedClass];
  gs = {hp:12,maxHp:12,items:[],flags:{},score:0,moves:0,race:r.name,cls:c.name,potions:1,ally:null};
  gs.maxHp += (r.hp||0) + (c.hp||0);
  gs.hp = gs.maxHp;
  [r.item,c.item].forEach(i=>{if(i && !gs.items.includes(i)) gs.items.push(i);});
  cid='intro';
  renderGameShell();
  upd();
}

function renderGameShell(){
  document.getElementById('game').innerHTML = `
    <div class="stats" id="stats">
      <div class="stat"><div class="stat-label">HP</div><div class="stat-val" id="s-hp">12</div><div class="hp-bar-wrap"><div class="hp-bar" id="hp-bar" style="width:100%"></div></div></div>
      <div class="stat"><div class="stat-label">Score</div><div class="stat-val" id="s-score">0</div></div>
      <div class="stat"><div class="stat-label">Move</div><div class="stat-val" id="s-move">1</div></div>
      <div class="stat"><div class="stat-label">Hero</div><div class="stat-val" id="s-hero" style="font-size:0.62rem;font-family:'EB Garamond',serif;color:var(--text-dim);">—</div></div>
      <div class="stat"><div class="stat-label">Potions</div><div class="stat-val" id="s-potions">0</div><button class="potion-btn" onclick="usePotion()">Use</button></div>
      <div class="stat"><div class="stat-label">Carrying</div><div class="stat-val" id="s-inv" style="font-size:0.55rem;font-family:'EB Garamond',serif;color:var(--text-dim);">Nothing</div></div>
    </div>
    <div class="scene"><div class="scene-loc" id="s-loc">Loading...</div><div class="scene-body" id="s-body"></div></div>
    <div class="choices" id="s-choices"></div>`;
}

function upd(){
  const sc = SCENES[cid];
  if(!sc){showBroken('Scene not found: '+cid);return;}
  if(sc.end){showEnd(sc);return;}

  document.getElementById('s-loc').textContent=sc.loc;
  document.getElementById('s-body').innerHTML=sc.text.replace(/\n/g,'<br><br>');

  const keys=['A','B','C','D','E','F','G'];

  // Hide unavailable item/flag choices instead of showing locked options.
  // This keeps the game from feeling like it is teasing choices the player cannot access yet.
  const allChoices=sc.c||[];
  const visibleChoices = allChoices
    .map((ch, originalIndex)=>({...ch, originalIndex}))
    .filter(ch=>{
      if(ch.need && !hasItem(ch.need)) return false;
      if(ch.needFlag && !hasFlag(ch.needFlag)) return false;
      return true;
    });

  document.getElementById('s-choices').innerHTML = visibleChoices.map((ch,i)=>{
    return `<button class="choice" onclick="pick(${ch.originalIndex})">
      <span class="choice-key">${keys[i]}</span>
      <span class="choice-text">${esc(ch.t)}</span>
    </button>`;
  }).join('');

  document.getElementById('s-hp').textContent=gs.hp+'/'+gs.maxHp;
  document.getElementById('s-score').textContent=gs.score;
  document.getElementById('s-move').textContent=gs.moves+1;
  document.getElementById('s-hero').textContent=(gs.race&&gs.cls)?gs.race+' '+gs.cls:'—';
  const potEl=document.getElementById('s-potions'); if(potEl) potEl.textContent=gs.potions||0;
  const invText = gs.items.length?gs.items.join(', '):'Nothing';
  document.getElementById('s-inv').textContent=(gs.ally?('Ally: '+gs.ally+' · '):'')+invText;
  document.getElementById('hp-bar').style.width=Math.max(0,Math.min(100,(gs.hp/gs.maxHp)*100))+'%';
  document.getElementById('hp-bar').style.background = gs.hp <= 3 ? 'var(--red)' : 'var(--green)';
}

function pick(i){
  const sc=SCENES[cid];
  const ch=(sc.c||[])[i];
  if(!ch)return;
  if(ch.need && !hasItem(ch.need))return;
  if(ch.needFlag && !hasFlag(ch.needFlag))return;

  if(typeof ch.hp === 'number') gs.hp = Math.max(0,Math.min(gs.maxHp,gs.hp+ch.hp));
  if(ch.sc) gs.score += ch.sc;
  if(typeof ch.potion === 'number') gs.potions = Math.max(0,(gs.potions||0)+ch.potion);
  if(ch.gives && !gs.items.includes(ch.gives)) gs.items.push(ch.gives);
  if(ch.ally) gs.ally = ch.ally;
  if(ch.flag) gs.flags[ch.flag]=true;
  gs.moves++;

  if(gs.hp<=0){showDead();return;}
  cid=ch.n;
  upd();
}

function usePotion(){
  if(!gs || !gs.potions || gs.potions <= 0) return;
  if(gs.hp >= gs.maxHp) return;
  gs.potions--;
  gs.hp = Math.min(gs.maxHp, gs.hp + 4);
  upd();
}

function showEnd(e){
  const g={S:'⭐⭐⭐',A:'⭐⭐',B:'⭐',C:'◎',D:'◇'};
  const inv=gs.items.length?gs.items.join(', '):'Nothing';
  document.getElementById('game').innerHTML=`<div class="ending">
    <span class="ending-icon">${g[e.grade]||'◉'}</span>
    <div class="ending-title">${e.title}</div>
    <div class="ending-desc">${e.desc}</div>
    <div class="ending-score">Grade: ${e.grade} · Score: ${gs.score} · Moves: ${gs.moves}<br>Hero: ${esc(gs.race)} ${esc(gs.cls)}${gs.ally?' · Ally: '+esc(gs.ally):''} · Potions: ${gs.potions||0}<br>Carried: ${esc(inv)}</div>
    <button class="btn" onclick="restart()">Play Again</button>
  </div>`;
}

function showDead(){
  document.getElementById('game').innerHTML=`<div class="ending">
    <span class="ending-icon">💀</span>
    <div class="ending-title">Fallen</div>
    <div class="ending-desc">The vault claims another visitor. The thing below waits for the next one.</div>
    <div class="ending-score">Score: ${gs.score} · Moves: ${gs.moves}</div>
    <button class="btn" onclick="restart()">Try Again</button>
  </div>`;
}

function showBroken(msg){
  document.getElementById('game').innerHTML=`<div class="ending">
    <span class="ending-icon">⚠</span>
    <div class="ending-title">Game Error</div>
    <div class="ending-desc">${esc(msg)}</div>
    <button class="btn" onclick="restart()">Restart</button>
  </div>`;
}

function restart(){
  selectedRace=null;
  selectedClass=null;
  renderSetup();
}

document.getElementById('backBtn').addEventListener('click',function(e){
  e.preventDefault();
  document.getElementById('overlay').classList.add('active');
  setTimeout(()=>window.location.href=this.href,500);
});

// Simple embers background
(function(){
  const c=document.getElementById('embers'),ctx=c.getContext('2d');
  let w,h,parts=[];
  function resize(){w=c.width=innerWidth;h=c.height=innerHeight;parts=Array.from({length:45},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*2+0.5,s:Math.random()*0.6+0.2,o:Math.random()*0.5+0.15}));}
  function draw(){ctx.clearRect(0,0,w,h);parts.forEach(p=>{p.y-=p.s;if(p.y<0){p.y=h;p.x=Math.random()*w;}ctx.beginPath();ctx.fillStyle=`rgba(200,149,42,${p.o})`;ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();});requestAnimationFrame(draw);}
  addEventListener('resize',resize);resize();draw();
})();

renderSetup();
</script>
