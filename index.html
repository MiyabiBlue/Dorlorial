<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tales of Dorlorial</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --gold: #C8952A;
    --gold-light: #E8B84B;
    --gold-pale: #F5D98A;
    --gold-dark: #8A6010;
    --ink: #060402;
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #060402;
    cursor: default;
  }

  /* ── BACKGROUND ── */
  .bg-layer {
    position: fixed; inset: 0; z-index: 0;
    background: radial-gradient(ellipse 80% 60% at 50% 40%, #1a0e02 0%, #060402 70%);
  }
  .bg-layer::after {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 100% 100% at 50% 50%,
      transparent 40%, rgba(0,0,0,0.85) 100%);
  }

  /* ── EMBER CANVAS ── */
  #embers {
    position: fixed; inset: 0; z-index: 1;
    pointer-events: none;
  }

  /* ── CORNER ORNAMENTS ── */
  .corner {
    position: fixed; z-index: 3;
    width: 120px; height: 120px;
    pointer-events: none;
    opacity: 0;
    animation: fadeIn 2s ease 0.5s forwards;
  }
  .corner svg { width: 100%; height: 100%; }
  .corner-tl { top: 20px; left: 20px; }
  .corner-tr { top: 20px; right: 20px; transform: scaleX(-1); }
  .corner-bl { bottom: 20px; left: 20px; transform: scaleY(-1); }
  .corner-br { bottom: 20px; right: 20px; transform: scale(-1,-1); }

  /* ── MAIN CONTENT ── */
  .stage {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: 40px;
  }

  .eyebrow {
    font-family: 'Cinzel', serif;
    font-size: clamp(0.55rem, 1.2vw, 0.75rem);
    font-weight: 600;
    letter-spacing: 0.45em;
    color: var(--gold);
    text-transform: uppercase;
    opacity: 0;
    animation: slideUp 1.2s ease 0.3s forwards;
    margin-bottom: 28px;
  }

  .divider {
    width: 180px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0;
    animation: fadeIn 1.4s ease 0.6s forwards;
    margin-bottom: 28px;
  }

  .title-wrap {
    position: relative;
    opacity: 0;
    animation: slideUp 1.4s ease 0.5s forwards;
    margin-bottom: 8px;
  }
  .title-tales {
    display: block;
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(0.9rem, 2.2vw, 1.4rem);
    font-weight: 400;
    letter-spacing: 0.6em;
    color: var(--gold-light);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .title-of {
    display: block;
    font-family: 'EB Garamond', serif;
    font-style: italic;
    font-size: clamp(0.7rem, 1.4vw, 1rem);
    letter-spacing: 0.35em;
    color: var(--gold-dark);
    margin-bottom: 10px;
  }
  .title-main {
    display: block;
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(3rem, 9vw, 7.5rem);
    font-weight: 900;
    letter-spacing: 0.08em;
    line-height: 0.9;
    background: linear-gradient(180deg,
      var(--gold-pale) 0%,
      var(--gold-light) 35%,
      var(--gold) 65%,
      var(--gold-dark) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 40px rgba(200,149,42,0.25));
  }

  .title-glow {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 600px; height: 200px;
    background: radial-gradient(ellipse, rgba(200,149,42,0.12) 0%, transparent 70%);
    pointer-events: none;
    z-index: -1;
  }

  .divider-lower {
    display: flex; align-items: center; gap: 16px;
    opacity: 0;
    animation: fadeIn 1.6s ease 1s forwards;
    margin-top: 22px; margin-bottom: 28px;
  }
  .divider-lower .line {
    width: 80px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-dark));
  }
  .divider-lower .line.right {
    background: linear-gradient(90deg, var(--gold-dark), transparent);
  }
  .divider-lower .diamond {
    width: 6px; height: 6px;
    background: var(--gold);
    transform: rotate(45deg);
  }

  .quote {
    font-family: 'EB Garamond', serif;
    font-style: italic;
    font-size: clamp(0.95rem, 2vw, 1.25rem);
    color: rgba(245, 217, 138, 0.7);
    letter-spacing: 0.04em;
    line-height: 1.7;
    max-width: 600px;
    opacity: 0;
    animation: slideUp 1.4s ease 1.1s forwards;
    margin-bottom: 6px;
  }
  .quote-attr {
    font-family: 'Cinzel', serif;
    font-size: clamp(0.5rem, 1vw, 0.65rem);
    letter-spacing: 0.3em;
    color: var(--gold-dark);
    text-transform: uppercase;
    opacity: 0;
    animation: fadeIn 1.4s ease 1.5s forwards;
    margin-bottom: 52px;
  }

  .enter-btn {
    position: relative;
    font-family: 'Cinzel', serif;
    font-size: clamp(0.6rem, 1.1vw, 0.75rem);
    font-weight: 700;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: var(--gold);
    text-decoration: none;
    padding: 16px 52px;
    border: 1px solid rgba(200,149,42,0.4);
    background: transparent;
    cursor: pointer;
    transition: all 0.4s ease;
    opacity: 0;
    animation: fadeIn 1.4s ease 1.8s forwards;
    display: inline-block;
  }
  .enter-btn::before {
    content: '';
    position: absolute;
    top: -4px; left: -4px;
    width: 12px; height: 12px;
    border-top: 1px solid var(--gold);
    border-left: 1px solid var(--gold);
    transition: all 0.4s ease;
  }
  .enter-btn::after {
    content: '';
    position: absolute;
    bottom: -4px; right: -4px;
    width: 12px; height: 12px;
    border-bottom: 1px solid var(--gold);
    border-right: 1px solid var(--gold);
    transition: all 0.4s ease;
  }
  .enter-btn:hover {
    background: rgba(200,149,42,0.08);
    border-color: var(--gold);
    color: var(--gold-light);
    letter-spacing: 0.6em;
    box-shadow: 0 0 30px rgba(200,149,42,0.15), inset 0 0 20px rgba(200,149,42,0.05);
  }
  .enter-btn:hover::before { top: -6px; left: -6px; width: 16px; height: 16px; }
  .enter-btn:hover::after  { bottom: -6px; right: -6px; width: 16px; height: 16px; }

  /* ── KEYFRAMES ── */
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── TRANSITION OVERLAY ── */
  .transition-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: #060402;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  .transition-overlay.active {
    opacity: 1;
    pointer-events: all;
  }
</style>
</head>
<body>

<div class="bg-layer"></div>
<canvas id="embers"></canvas>

<!-- Corner ornaments -->
<div class="corner corner-tl">
  <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M10 90 L10 10 L90 10" stroke="#C8952A" stroke-width="1" opacity="0.6"/>
    <path d="M10 70 L10 10 L70 10" stroke="#C8952A" stroke-width="0.5" opacity="0.3"/>
    <circle cx="10" cy="10" r="3" fill="#C8952A" opacity="0.8"/>
    <rect x="6" y="6" width="8" height="8" stroke="#C8952A" stroke-width="0.5" fill="none" opacity="0.5" transform="rotate(45 10 10)"/>
  </svg>
</div>
<div class="corner corner-tr">
  <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M10 90 L10 10 L90 10" stroke="#C8952A" stroke-width="1" opacity="0.6"/>
    <path d="M10 70 L10 10 L70 10" stroke="#C8952A" stroke-width="0.5" opacity="0.3"/>
    <circle cx="10" cy="10" r="3" fill="#C8952A" opacity="0.8"/>
    <rect x="6" y="6" width="8" height="8" stroke="#C8952A" stroke-width="0.5" fill="none" opacity="0.5" transform="rotate(45 10 10)"/>
  </svg>
</div>
<div class="corner corner-bl">
  <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M10 90 L10 10 L90 10" stroke="#C8952A" stroke-width="1" opacity="0.6"/>
    <path d="M10 70 L10 10 L70 10" stroke="#C8952A" stroke-width="0.5" opacity="0.3"/>
    <circle cx="10" cy="10" r="3" fill="#C8952A" opacity="0.8"/>
    <rect x="6" y="6" width="8" height="8" stroke="#C8952A" stroke-width="0.5" fill="none" opacity="0.5" transform="rotate(45 10 10)"/>
  </svg>
</div>
<div class="corner corner-br">
  <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M10 90 L10 10 L90 10" stroke="#C8952A" stroke-width="1" opacity="0.6"/>
    <path d="M10 70 L10 10 L70 10" stroke="#C8952A" stroke-width="0.5" opacity="0.3"/>
    <circle cx="10" cy="10" r="3" fill="#C8952A" opacity="0.8"/>
    <rect x="6" y="6" width="8" height="8" stroke="#C8952A" stroke-width="0.5" fill="none" opacity="0.5" transform="rotate(45 10 10)"/>
  </svg>
</div>

<!-- Main stage -->
<div class="stage">
  <p class="eyebrow">A World Awaits Beyond the Veil</p>
  <div class="divider"></div>

  <div class="title-wrap">
    <div class="title-glow"></div>
    <span class="title-tales">Tales of</span>
    <span class="title-of">the realm known as</span>
    <span class="title-main">Dorlorial</span>
  </div>

  <div class="divider-lower">
    <div class="line"></div>
    <div class="diamond"></div>
    <div class="diamond" style="opacity:0.4; transform:rotate(45deg) scale(0.6)"></div>
    <div class="diamond"></div>
    <div class="line right"></div>
  </div>

  <p class="quote">
    "The road does not ask if you are ready.<br>
    It only asks if you are willing to walk."
  </p>
  <p class="quote-attr">— Ancient Proverb of Dorlorial</p>

  <a href="hub.html" class="enter-btn" id="enterBtn">Enter the Realm</a>
</div>

<div class="transition-overlay" id="overlay"></div>

<script>
// ── EMBER SYSTEM ──
const canvas = document.getElementById('embers');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

function rand(a, b) { return a + Math.random() * (b - a); }

function spawnEmber(initial) {
  let x, y;
  if (initial) {
    x = rand(0, canvas.width);
    y = rand(0, canvas.height);
  } else {
    const side = Math.random();
    if (side < 0.6) {
      x = rand(0, canvas.width);
      y = canvas.height + 10;
    } else if (side < 0.8) {
      x = -10; y = rand(canvas.height * 0.2, canvas.height);
    } else {
      x = canvas.width + 10; y = rand(canvas.height * 0.2, canvas.height);
    }
  }
  return {
    x, y,
    size:    rand(1.0, 3.8),
    speed:   rand(0.3, 1.8),
    drift:   rand(-0.7, 0.7),
    wobble:  rand(0.006, 0.028),
    wOff:    rand(0, Math.PI * 2),
    life:    rand(0.5, 1.0),
    decay:   rand(0.0006, 0.0025),
    bright:  rand(0.4, 1.0),
    flicker: rand(0.008, 0.05),
    age:     initial ? rand(0, 300) : 0,
  };
}

const MAX = 160;
const embers = [];
for (let i = 0; i < MAX; i++) embers.push(spawnEmber(true));

function drawEmber(e) {
  const flicker = 0.65 + Math.sin(e.age * e.flicker * 80) * 0.35;
  const alpha   = Math.min(e.life, 1.0) * e.bright * flicker;

  const g = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.size * 3.5);
  g.addColorStop(0,   `rgba(255,215,80,${alpha * 0.95})`);
  g.addColorStop(0.4, `rgba(220,130,20,${alpha * 0.45})`);
  g.addColorStop(1,   `rgba(160,60,0,0)`);
  ctx.beginPath();
  ctx.arc(e.x, e.y, e.size * 3.5, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();

  ctx.beginPath();
  ctx.arc(e.x, e.y, e.size * 0.55, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(255,248,210,${alpha})`;
  ctx.fill();
}

let frame = 0;
(function loop() {
  requestAnimationFrame(loop);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  frame++;

  for (let i = embers.length - 1; i >= 0; i--) {
    const e = embers[i];
    e.age++;
    e.life -= e.decay;
    e.x += e.drift + Math.sin(e.age * e.wobble + e.wOff) * 0.9;
    e.y -= e.speed;
    drawEmber(e);

    if (e.life <= 0 || e.y < -20 || e.x < -20 || e.x > canvas.width + 20) {
      embers.splice(i, 1);
      embers.push(spawnEmber(false));
    }
  }

  // burst every 35 frames
  if (frame % 35 === 0 && embers.length < MAX + 25) {
    for (let j = 0; j < 4; j++) embers.push(spawnEmber(false));
  }
})();

// ── PAGE TRANSITION ──
document.getElementById('enterBtn').addEventListener('click', function(e) {
  e.preventDefault();
  const overlay = document.getElementById('overlay');
  const href = this.getAttribute('href');
  overlay.classList.add('active');
  setTimeout(() => { window.location.href = href; }, 900);
});
</script>
</body>
</html>
